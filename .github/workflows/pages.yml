name: Deploy Weld Academy to Pages

# Publishes weld-academy/ (a static, offline-first PWA with no build step) to
# GitHub Pages on every push to main that touches it. The optional server/
# folder is never part of this — Pages only serves static files.
on:
  push:
    branches: [main]
    paths:
      - 'weld-academy/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # server/ has real (if low-stakes) sync data files it writes locally
      # during self-hosting; never publish it to the public site.
      - name: Stage the public app only
        run: |
          mkdir /tmp/pages-site
          rsync -a --exclude='server' weld-academy/ /tmp/pages-site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/pages-site

      - id: deployment
        uses: actions/deploy-pages@v4

<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
  <meta name="theme-color" content="#101216">
  <meta name="description" content="Weld Academy — learn stick, MIG and TIG properly, drill it at the bench, and diagnose your own welds in the shed.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Weld Academy">
  <title>Weld Academy</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header id="header" class="header"></header>

  <main id="view" class="view">
    <noscript>
      <p style="padding:24px;color:#eee">Weld Academy needs JavaScript switched on. It all runs on your own device — nothing is sent anywhere.</p>
    </noscript>
  </main>

  <!-- Shared paint for the diagrams. SVG gradients have to live in the
       document; the .d-* CSS classes reference these by id. -->
  <svg class="d-defs" width="0" height="0" aria-hidden="true" focusable="false"><defs>
    <linearGradient id="gPlate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b6675"/><stop offset="0.55" stop-color="#46505f"/><stop offset="1" stop-color="#39424f"/>
    </linearGradient>
    <linearGradient id="gWeld" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd894"/><stop offset="0.45" stop-color="#ffa62b"/><stop offset="1" stop-color="#e07d0a"/>
    </linearGradient>
    <linearGradient id="gTung" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6ecf3"/><stop offset="1" stop-color="#9aa6b4"/>
    </linearGradient>
    <linearGradient id="gPipe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b6675"/><stop offset="0.5" stop-color="#46505f"/><stop offset="1" stop-color="#333c48"/>
    </linearGradient>
    <filter id="fGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs></svg>

  <nav id="tabbar" class="tabbar"></nav>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="js/content.js"></script>
  <script src="js/reference.js"></script>
  <script src="js/diagrams.js"></script>
  <script src="js/practice.js"></script>
  <script src="js/content-mastery.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/profile.js"></script>
  <script src="js/juice.js"></script>
  <script src="js/vision.js"></script>
  <script src="js/script.js"></script>
  <script src="js/narrator.js"></script>
  <script src="js/drive.js"></script>
  <script src="js/market.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
